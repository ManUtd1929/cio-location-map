<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>CIO Logistics — Location</title>

    <!-- MapLibre -->
    <link
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        /* CIO marker */

        .cio-marker {
            width: 92px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 10px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.30);

            border: 2px solid white;

            cursor: pointer;

            overflow: hidden;
        }

        .cio-marker img {
            width: 84px;
            height: 42px;

            object-fit: contain;

            display: block;
        }

        /* Popup */

        .maplibregl-popup-content {
            padding: 14px;

            border-radius: 14px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, 0.20);

            text-align: center;

            min-width: 190px;
        }

        .popup-logo {
            width: 100px;
            max-height: 60px;

            object-fit: contain;

            margin-bottom: 8px;
        }

        .popup-title {
            font-size: 17px;
            font-weight: bold;

            margin-bottom: 7px;
        }

        .popup-address {
            font-size: 14px;
            line-height: 1.4;
        }

        /* Bottom card */

        .office-card {
            position: fixed;

            left: 16px;
            right: 16px;
            bottom: 24px;

            max-width: 460px;

            margin: 0 auto;

            padding: 16px;

            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.25);

            z-index: 10;
        }

        .office-card h3 {
            margin: 0 0 7px;

            font-size: 20px;
        }

        .office-address {
            margin: 0 0 14px;

            font-size: 15px;
            line-height: 1.4;
        }

        .taxi-button {
            display: block;

            width: 100%;

            box-sizing: border-box;

            padding: 14px;

            border-radius: 12px;

            text-align: center;

            background: #ffcc00;
            color: #000;

            text-decoration: none;

            font-weight: bold;
            font-size: 16px;
        }

        .taxi-button:active {
            transform: scale(0.98);
        }

        /* Mobile */

        @media (max-width: 600px) {
            .office-card {
                left: 10px;
                right: 10px;
                bottom: 12px;

                padding: 14px;
            }

            .office-card h3 {
                font-size: 18px;
            }

            .office-address {
                font-size: 14px;
            }

            .taxi-button {
                padding: 13px;
                font-size: 15px;
            }

            .cio-marker {
                width: 82px;
                height: 46px;
            }

            .cio-marker img {
                width: 74px;
                height: 38px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="office-card">

    <h3>CIO Logistics</h3>

    <p class="office-address">
        📍 Наири Зарьяна 22А, Ереван
    </p>

    <a
        class="taxi-button"
        href="https://3.redirect.appmetrica.yandex.com/route?end-lat=40.204062&end-lon=44.509160&ref=widget&appmetrica_tracking_id=1178268795219780156&lang=ru"
    >
        🚕 Вызвать Яндекс Go
    </a>

</div>

<script>

    const officeLongitude = 44.509160;
    const officeLatitude = 40.204062;

    /*
        MAP
    */

    const map = new maplibregl.Map({

        container: "map",

        style:
            "https://tiles.openfreemap.org/styles/liberty",

        center: [
            officeLongitude,
            officeLatitude
        ],

        zoom: 16.5,

        pitch: 0,

        attributionControl: true

    });

    /*
        Zoom controls
    */

    map.addControl(
        new maplibregl.NavigationControl({
            showCompass: false
        }),
        "top-right"
    );

    /*
        CIO logo marker
    */

    const markerElement =
        document.createElement("div");

    markerElement.className =
        "cio-marker";

    const logo =
        document.createElement("img");

    logo.src =
        "photo_5222207223352730433_y.jpg";

    logo.alt =
        "CIO Logistics";

    markerElement.appendChild(
        logo
    );

    /*
        Popup
    */

    const popup =
        new maplibregl.Popup({
            offset: 28,
            closeButton: true
        })
        .setHTML(`
            <div>

                <img
                    class="popup-logo"
                    src="photo_5222207223352730433_y.jpg"
                    alt="CIO Logistics"
                >

                <div class="popup-title">
                    CIO Logistics
                </div>

                <div class="popup-address">
                    📍 Наири Зарьяна 22А, Ереван
                </div>

            </div>
        `);

    /*
        Marker
    */

    new maplibregl.Marker({
        element: markerElement,
        anchor: "bottom"
    })

        .setLngLat([
            officeLongitude,
            officeLatitude
        ])

        .setPopup(popup)

        .addTo(map);

</script>

</body>
</html>
