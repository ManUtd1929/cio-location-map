<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CIO Logistics — Location</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .cio-marker {
            width: 76px;
            height: 76px;

            background: white;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.30);

            border: 2px solid white;
        }

        .cio-marker img {
            width: 66px;
            max-height: 66px;
            object-fit: contain;
            border-radius: 10px;
        }

        .office-card {
            position: fixed;

            left: 16px;
            right: 16px;
            bottom: 30px;

            max-width: 480px;
            margin: 0 auto;

            background: white;

            border-radius: 18px;

            padding: 16px;

            box-sizing: border-box;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);

            z-index: 1000;
        }

        .office-card h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .office-card p {
            margin: 0 0 14px;
            font-size: 15px;
            line-height: 1.4;
        }

        .taxi-button {
            display: block;

            text-align: center;

            padding: 14px;

            border-radius: 12px;

            background: #ffcc00;
            color: #000;

            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        .leaflet-popup-content {
            text-align: center;
        }

        .popup-logo {
            width: 90px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="office-card">
    <h3>CIO Logistics</h3>

    <p>
        📍 Наири Зарьяна 22А, Ереван
    </p>

    <a
        class="taxi-button"
        href="https://3.redirect.appmetrica.yandex.com/route?end-lat=40.204062&end-lon=44.509160&ref=widget&appmetrica_tracking_id=1178268795219780156&lang=ru"
    >
        🚕 Вызвать Яндекс Go
    </a>
</div>

<script>
    const officeLatitude = 40.204062;
    const officeLongitude = 44.509160;

    const map = L.map("map").setView(
        [officeLatitude, officeLongitude],
        17
    );

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
    ).addTo(map);

    const cioIcon = L.divIcon({
        className: "",
        html: `
            <div class="cio-marker">
                <img
                    src="photo_5222207223352730433_y.jpg"
                    alt="CIO Logistics"
                >
            </div>
        `,
        iconSize: [76, 76],
        iconAnchor: [38, 76],
        popupAnchor: [0, -76]
    });

    const marker = L.marker(
        [officeLatitude, officeLongitude],
        {
            icon: cioIcon
        }
    ).addTo(map);

    marker.bindPopup(`
        <div>
            <img
                class="popup-logo"
                src="photo_5222207223352730433_y.jpg"
                alt="CIO Logistics"
            >

            <br>

            <strong>CIO Logistics</strong>

            <br><br>

            📍 Наири Зарьяна 22А, Ереван
        </div>
    `);
</script>

</body>
</html>
