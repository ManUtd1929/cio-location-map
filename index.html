<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>CIO Logistics — Location</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* CIO marker */

        .cio-marker {
            width: 90px;
            height: 48px;

            background: white;
            border: 2px solid white;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.30);
        }

        .cio-marker img {
            width: 82px;
            height: 40px;

            object-fit: contain;
            display: block;
        }

        /* Popup */

        .leaflet-popup-content-wrapper {
            border-radius: 14px;
        }

        .leaflet-popup-content {
            text-align: center;
            margin: 14px;
        }

        .popup-logo {
            width: 100px;
            max-height: 58px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .popup-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .popup-address {
            font-size: 14px;
            line-height: 1.4;
        }

        /* Bottom office card */

        .office-card {
            position: fixed;

            left: 16px;
            right: 16px;
            bottom: 24px;

            max-width: 460px;
            margin: 0 auto;

            padding: 16px;

            box-sizing: border-box;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 18px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.25);

            z-index: 1000;
        }

        .office-card h3 {
            margin: 0 0 7px;
            font-size: 20px;
        }

        .office-address {
            margin: 0 0 14px;

            font-size: 15px;
            line-height: 1.4;
        }

        .taxi-button {
            display: block;

            width: 100%;
            box-sizing: border-box;

            padding: 14px;

            border-radius: 12px;

            text-align: center;

            background: #ffcc00;
            color: #000;

            text-decoration: none;

            font-weight: bold;
            font-size: 16px;
        }

        .taxi-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {
            .office-card {
                left: 10px;
                right: 10px;
                bottom: 12px;

                padding: 14px;
            }

            .office-card h3 {
                font-size: 18px;
            }

            .office-address {
                font-size: 14px;
            }

            .taxi-button {
                padding: 13px;
                font-size: 15px;
            }

            .cio-marker {
                width: 82px;
                height: 44px;
            }

            .cio-marker img {
                width: 74px;
                height: 36px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="office-card">

    <h3>CIO Logistics</h3>

    <p class="office-address">
        📍 Наири Зарьяна 22А, Ереван
    </p>

    <a
        class="taxi-button"
        href="https://3.redirect.appmetrica.yandex.com/route?end-lat=40.204062&end-lon=44.509160&ref=widget&appmetrica_tracking_id=1178268795219780156&lang=ru"
    >
        🚕 Вызвать Яндекс Go
    </a>

</div>

<script>
    const officeLatitude = 40.204062;
    const officeLongitude = 44.509160;

    /*
        MAP
    */

    const map = L.map("map", {
        zoomControl: true
    }).setView(
        [officeLatitude, officeLongitude],
        18
    );

    /*
        OpenStreetMap tiles

        detectRetina improves rendering
        on high-density / Retina displays.
    */

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            maxNativeZoom: 19,
            detectRetina: true,

            attribution:
                '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }
    ).addTo(map);

    /*
        CIO custom marker
    */

    const cioIcon = L.divIcon({
        className: "",

        html: `
            <div class="cio-marker">
                <img
                    src="photo_5222207223352730433_y.jpg"
                    alt="CIO Logistics"
                >
            </div>
        `,

        iconSize: [90, 48],
        iconAnchor: [45, 48],
        popupAnchor: [0, -52]
    });

    /*
        Popup
    */

    const popupContent = `
        <div>

            <img
                class="popup-logo"
                src="photo_5222207223352730433_y.jpg"
                alt="CIO Logistics"
            >

            <div class="popup-title">
                CIO Logistics
            </div>

            <div class="popup-address">
                📍 Наири Зарьяна 22А, Ереван
            </div>

        </div>
    `;

    /*
        Marker
    */

    const marker = L.marker(
        [officeLatitude, officeLongitude],
        {
            icon: cioIcon
        }
    )
    .addTo(map)
    .bindPopup(popupContent);

</script>

</body>
</html>
